# The destination GitHub uses for this repo's "Sponsor" button.
#
# This was `github: initiator1` — GitHub Sponsors is not switched on for that
# account, so GitHub ignored the key and the repo asked for nothing.
#
# `custom` rather than `ko_fi:` on purpose: the `ko_fi:` field takes a username
# only and drops the query string, and `?app=unstray` is how one page serving
# four apps tells which one sent the person.
#
# NOTE, 2026-08-20: the Sponsor button needs BOTH halves — a funding link
# GitHub has recorded AND the repo's own Sponsorships feature ticked on in
# Settings > General > Features. Either half alone renders nothing and errors
# nothing. Both are now in place: the public page shows "Sponsor this project"
# linking to the URL below, verified logged out. Do not remove either half.
custom: https://ko-fi.com/initiatorworks?app=unstray
